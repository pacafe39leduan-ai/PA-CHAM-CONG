<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hóng Rồi mách lẻo – PA staff</title>
<meta name="theme-color" content="#4a3324">
<link rel="manifest" href="hr.webmanifest">
<link rel="icon" href="hr/icon-192.png">
<style>
  :root { --nau:#4a3324; --nau2:#6f4e37; --kem:#f5ece0; --kem2:#efe3d3; --chu:#2b2018; --mo:#8a7a6b; --do:#c0392b; --vang:#b7791f; --xanh:#2e7d4f; }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif; color:var(--chu); background:var(--kem); overflow:hidden; }
  header { position:fixed; top:0; left:0; right:0; height:46px; display:flex; align-items:center; gap:8px; padding:0 10px; background:var(--nau); color:#fff; z-index:5; }
  header b { font-size:15px; white-space:nowrap; }
  header .tt { font-size:12px; opacity:.75; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; flex:1; }
  header button { background:transparent; color:#fff; border:1px solid rgba(255,255,255,.35); border-radius:8px; padding:4px 8px; font-size:13px; cursor:pointer; white-space:nowrap; }
  header button.tat { opacity:.45; }
  #cho { display:flex; gap:4px; }
  #cho span { background:#fff; color:var(--nau); border-radius:10px; font-size:12px; padding:2px 8px; cursor:pointer; white-space:nowrap; }
  #canh { position:fixed; top:46px; left:0; right:0; bottom:0; }
  #san { position:absolute; left:0; right:0; bottom:0; height:34%; background:var(--kem2); border-top:2px solid #e2d2bd; }
  #tuong { position:absolute; left:0; right:0; top:0; bottom:34%; background:
      linear-gradient(90deg, transparent 0 46px, rgba(111,78,55,.06) 46px 48px) 0 0/48px 100%; }
  #bien { position:absolute; left:12px; top:10px; font-size:12px; color:var(--mo); }
  #hrw { position:absolute; bottom:max(11%, 54px); left:120px; width:0; height:0; z-index:1; }
  #hrb { position:absolute; bottom:0; left:0; transform:translateX(-50%); }
  #hr { display:block; height:260px; transform-origin:50% 100%; cursor:grab; touch-action:none; user-select:none; -webkit-user-drag:none; filter: drop-shadow(0 6px 4px rgba(0,0,0,.12)); }
  #hr.lat, #hrCu.lat { scale: -1 1; }
  #hrCu { position:absolute; left:50%; bottom:0; translate:-50% 0; display:block; opacity:0; pointer-events:none; filter: drop-shadow(0 6px 4px rgba(0,0,0,.12)); }
  #hrCu:not([src]) { display:none; }
  #hrCu.mo { animation: moDan .18s ease-out forwards; }
  @keyframes moDan { from { opacity:1; } to { opacity:0; } }
  #zzz { position:absolute; top:-6px; right:-26px; z-index:2; width:60px; height:80px; pointer-events:none; display:none; font-weight:700; color:#6f4e37; font-family:Georgia, serif; }
  #hrb.ngu #zzz { display:block; }
  #zzz span { position:absolute; left:0; bottom:0; opacity:0; animation: zbay 3.6s ease-out infinite; text-shadow:0 1px 0 #fff, 0 0 4px rgba(255,255,255,.8); }
  #zzz span:nth-child(1) { font-size:14px; animation-delay:0s; }
  #zzz span:nth-child(2) { font-size:19px; animation-delay:1.2s; }
  #zzz span:nth-child(3) { font-size:25px; animation-delay:2.4s; }
  @keyframes zbay { 0% { opacity:0; translate:0 0; } 15% { opacity:1; } 100% { opacity:0; translate:26px -70px; } }
  /* ngủ gục bàn: ảnh hr/ngu.webp đặt lên chiếc bàn vẽ bằng CSS */
  #ban { display:none; position:absolute; left:50%; bottom:0; transform:translateX(-50%); width:var(--banR, 300px); height:var(--banC, 100px); pointer-events:none; }
  #hrb.ngu #ban { display:none; }   /* ảnh ngủ mới đã có bàn ghế */
  #hrb.ngu #hr { animation: thoNgu 3.6s ease-in-out infinite; position:relative; z-index:1; }
  @keyframes thoNgu { 0%,100% { scale:1 1; } 50% { scale:1.01 1.025; } }
  #ban .mat { position:absolute; left:0; right:0; top:0; height:16%; min-height:8px; border-radius:6px; background:linear-gradient(#8a6347, #6b4a33); box-shadow:0 3px 0 #4e3424; }
  #ban .than { position:absolute; left:6%; right:6%; top:16%; height:30%; background:linear-gradient(#5d4030, #4a3324); border-radius:0 0 6px 6px; }
  #ban .chan { position:absolute; top:40%; bottom:0; width:6%; background:linear-gradient(90deg, #4a3324, #5d4030); border-radius:0 0 3px 3px; }
  #ban .chan.t { left:10%; } #ban .chan.p { right:10%; }
  #ban .coc { position:absolute; bottom:calc(100% - 2px); left:4%; width:13%; aspect-ratio: 1 / 1.05; background:#fafafa; border-radius:2px 2px 6px 6px; box-shadow:inset -3px 0 0 #e6e6e6; display:flex; align-items:center; justify-content:center; font:700 clamp(7px, 1vw, 12px)/1 Arial, sans-serif; color:#333; }
  #ban .coc::after { content:''; position:absolute; right:-28%; top:22%; width:30%; height:45%; border:3px solid #fafafa; border-left:0; border-radius:0 8px 8px 0; }
  #ban .giay { position:absolute; bottom:calc(100% - 3px); right:6%; width:22%; height:6px; background:#fff; transform:rotate(-3deg); box-shadow:0 1px 0 #ccc; }
  #hr.dangKeo { cursor:grabbing; animation: lac .35s ease-in-out infinite; }
  @keyframes lac { 0%,100% { rotate:-6deg; } 50% { rotate:6deg; } }
  #hr.di { animation:none; }   /* ảnh bước chân đã có nhún */
  @keyframes buoc { 0%,100% { translate:0 0; } 50% { translate:0 -3px; } }
  #hr.chay { animation: chay .22s ease-in-out infinite; }
  @keyframes chay { 0%,100% { translate:0 0; rotate:-4deg; } 50% { translate:0 -5px; rotate:-2deg; } }
  #hr.giat { animation: giat .45s ease-in-out 2; }
  @keyframes giat { 0%,100% { translate:0 0; } 30% { translate:0 -14px; } }
  #hr.nhay { animation: nhay .55s cubic-bezier(.3,.7,.4,1) 1; }
  @keyframes nhay { 0%,100% { translate:0 0; } 45% { translate:0 -48px; } }
  #hr.tho { animation: tho 3.2s ease-in-out infinite; }
  @keyframes tho { 0%,100% { scale:1 1; } 50% { scale:1 1.012; } }
  #hr.lat.tho { animation:none; }
  #bong { position:absolute; max-width:min(420px, 72vw); background:#fff; border:2px solid var(--nau); border-radius:14px; padding:10px 12px; font-size:15px; line-height:1.45;
          box-shadow:0 4px 0 rgba(74,51,36,.15); opacity:0; transform:translateY(6px); transition:opacity .25s, transform .25s; pointer-events:none; z-index:3; }
  #bong.hien { opacity:1; transform:none; pointer-events:auto; cursor:pointer; }
  #bong .mo-dau { display:block; font-size:12px; color:var(--mo); margin-bottom:2px; }
  #bong .nhan { display:inline-block; font-size:11px; border-radius:6px; padding:1px 6px; margin-right:6px; color:#fff; vertical-align:1px; }
  #bong .tra { white-space:pre-line; }
  /* v57: câu dài không bị cắt – bong bóng cuộn được, cao tối đa vừa khung (đặt trong datBong), ô chat dính đáy */
  #bong { overflow-y:auto; overscroll-behavior:contain; }
  #bong .boqua { position:absolute; top:4px; right:6px; border:0; background:transparent; color:var(--mo); font-size:12px; cursor:pointer; padding:2px 4px; }
  #bong .boqua:hover { color:var(--do); }
  #bong.rong { max-width:min(560px, 92vw); max-height:min(70vh, 640px); overflow-y:auto; }
  #bong .goiy { border:1px solid var(--vang, #e0a800); background:#fff8e1; color:#7a5200; border-radius:12px; padding:2px 9px; font-size:12px; cursor:pointer; margin-left:4px; }
  #bong .gy { margin-top:6px; line-height:1.9; }
  #bong .gy span { display:block; font-size:11px; font-weight:700; color:var(--mo); text-transform:uppercase; letter-spacing:.3px; line-height:1.4; }
  #bong .cau { border:1px solid #d6dde6; background:#f4f7fb; color:inherit; border-radius:12px; padding:1px 8px; margin:0 4px 0 0; font-size:12px; cursor:pointer; }
  #bong .cau:hover { background:#e3ecf7; border-color:#9fb6d3; }
  #bong { padding-right:56px; }
  #bong small { display:block; margin-top:6px; font-size:11px; color:var(--mo); }
  #bong .nut { display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }
  #bong .nut button { font-size:13px; padding:5px 10px; border-radius:8px; border:1px solid var(--nau); background:#fff; color:var(--nau); cursor:pointer; }
  #bong .nut button:first-child { background:var(--nau); color:#fff; }
  #bong .nut:has(.goi) button:first-child:not(.goi) { background:#fff; color:var(--nau); }
  #bong .nut button.goi { background:var(--nau); color:#fff; box-shadow:0 0 0 3px #f2c94c; }
  #bong small.goi-y { display:block; margin-top:4px; color:#7a5200; }
  #bong .mo { color:var(--nau2); text-decoration:underline; cursor:pointer; }
  /* v51: báo cáo dạng thẻ – chữ ở trên, nút quyết định ở dưới */
  #bong .the { border:1px solid #e2d2bd; border-radius:10px; padding:7px 9px; margin-top:8px; background:#fffdf9; }
  #bong .the .nut { margin-top:6px; }
  #bong .the .kq { font-size:13px; margin-top:5px; color:var(--mo); white-space:pre-line; }
  #bong .the.xong { background:#f1f8f3; border-color:#b9dcc5; }
  #bong .the.xong .kq { color:#2e7d4f; }
  #bong .the.dang button { opacity:.5; pointer-events:none; }
  #bong .the .goi-y { margin-top:4px; }
  /* v59: phiên chat kiểu nhắn tin – mỗi câu 1 bong bóng riêng (sếp phải, Hóng trái), không còn khung lớn */
  #bong.chat { background:transparent; border:0; box-shadow:none; padding:0 6px 4px; max-width:min(460px, 88vw); width:min(460px, 88vw); cursor:default; scrollbar-width:thin; scrollbar-color:rgba(74,51,36,.35) transparent; }
  #bong.chat { scroll-padding-top:40px; scroll-padding-bottom:64px; }   /* nút không bị ô chat dính đáy / hàng tiêu đề che khi cuộn tới */
  #bong.chat::-webkit-scrollbar { width:6px; } #bong.chat::-webkit-scrollbar-thumb { background:rgba(74,51,36,.3); border-radius:6px; }
  #bong.chat .cs-dau-hang { position:sticky; top:0; z-index:2; display:flex; justify-content:space-between; align-items:center; gap:8px; padding:4px 0 2px; }
  #bong.chat .cs-dau { font-size:11.5px; color:var(--nau2); background:rgba(255,253,249,.95); border:1px solid #e2d2bd; border-radius:999px; padding:2px 10px; }
  #bong.chat .boqua { position:static; background:rgba(255,253,249,.95); border:1px solid #e2d2bd; border-radius:999px; padding:2px 10px; }
  #bong.chat .cs { display:flex; align-items:flex-end; gap:7px; margin:9px 0; animation:csVao .22s ease-out; }
  @keyframes csVao { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:none; } }
  #bong.chat .cs.sep { justify-content:flex-end; }
  #bong.chat .bb { position:relative; max-width:84%; padding:8px 12px 6px; border-radius:18px; white-space:pre-line; line-height:1.45; font-size:14.5px; box-shadow:0 2px 8px rgba(43,32,24,.14); }
  #bong.chat .cs.sep .bb { background:var(--nau2); color:#fff; border-bottom-right-radius:5px; }
  #bong.chat .cs.hong .bb { background:#fff; color:var(--chu); border:1px solid #eadbc8; border-bottom-left-radius:5px; }
  #bong.chat .cs.hong.loi .bb { border-color:#e8b9ad; color:#9b3426; }
  #bong.chat .cs.hong.bao .bb { border-left:4px solid var(--vang); }
  #bong.chat .gio { display:block; text-align:right; font-size:10.5px; margin-top:3px; opacity:.6; }
  #bong.chat .cs.sep .gio { color:#fff; opacity:.75; }
  #bong.chat .nhan-bao { display:block; font-size:11px; font-weight:700; color:var(--vang); letter-spacing:.2px; margin-bottom:2px; }
  #bong.chat .av { flex:none; width:26px; height:26px; border-radius:50%; background:#f3e7d6 url(hr/icon-192.png) center 18%/150% no-repeat; border:1.5px solid #fff; box-shadow:0 1px 4px rgba(0,0,0,.18); }
  #bong.chat .the { white-space:normal; background:#fffaf3; border-color:#efe1cf; margin-top:8px; }
  #bong.chat .cham { display:inline-flex; gap:4px; padding:4px 2px; } #bong.chat .cham i { width:7px; height:7px; border-radius:50%; background:var(--mo); animation:cham 1s infinite ease-in-out; }
  #bong.chat .cham i:nth-child(2) { animation-delay:.15s; } #bong.chat .cham i:nth-child(3) { animation-delay:.3s; }
  @keyframes cham { 0%, 60%, 100% { opacity:.3; transform:none; } 30% { opacity:1; transform:translateY(-3px); } }
  html.ts #bong.chat #chat { background:transparent; padding:6px 0 2px; }
  html.ts #bong.chat #chat input { border-radius:999px; box-shadow:0 2px 8px rgba(43,32,24,.18); }
  #chat { position:absolute; left:8px; bottom:8px; display:flex; gap:6px; width:min(380px, 52vw); z-index:2; }
  #chat input { flex:1; min-width:0; font-size:14px; padding:8px 10px; border:1px solid #cdb8a0; border-radius:10px; background:rgba(255,255,255,.95); }
  #chat button { font-size:14px; padding:8px 12px; border:0; border-radius:10px; background:var(--nau); color:#fff; cursor:pointer; }
  #so .d button { font-size:11px; padding:1px 6px; margin-left:4px; border:1px solid var(--nau2); background:#fff; color:var(--nau2); border-radius:6px; cursor:pointer; }
  #so { position:absolute; right:8px; bottom:8px; width:min(360px, 46vw); max-height:44%; overflow:auto; background:rgba(255,255,255,.92); border:1px solid #e2d2bd; border-radius:10px; font-size:12.5px; z-index:2; }
  #so h4 { margin:0; padding:6px 10px; font-size:12px; color:var(--mo); position:sticky; top:0; background:#fff; border-bottom:1px solid #eee; display:flex; justify-content:space-between; cursor:pointer; }
  #so .d { padding:5px 10px; border-bottom:1px solid #f3ece3; display:flex; gap:6px; }
  #so .d i { font-style:normal; color:var(--mo); min-width:36px; }
  #so.thu .ds { display:none; }
  #dang { position:fixed; inset:0; background:var(--kem); display:flex; align-items:center; justify-content:center; z-index:10; }
  #dang .hop { width:min(340px, 90vw); text-align:center; }
  #dang img { height:180px; }
  #dang input { width:100%; font-size:18px; padding:10px; border:1px solid #cdb8a0; border-radius:10px; text-align:center; margin:10px 0; }
  #dang button { width:100%; font-size:16px; padding:10px; border:0; border-radius:10px; background:var(--nau); color:#fff; cursor:pointer; }
  #dang p { color:var(--mo); font-size:13px; }
  #loiDang { color:var(--do) !important; min-height:18px; }
  /* Chế độ trong suốt (app Hóng Rồi cho Windows, hoặc hr.html?trongsuot=1): chỉ còn nhân vật + bong bóng */
  html.ts, html.ts body { background:transparent; }
  html.ts header, html.ts #tuong, html.ts #san, html.ts #bien, html.ts #so, html.ts #chat { display:none; }
  html.ts #canh { top:0; }
  html.ts #hrw { bottom:6px; }
  html.ts #bong { box-shadow:0 6px 18px rgba(0,0,0,.25); }
  html.ts #bong #chat { display:flex; position:sticky; bottom:-10px; width:auto; margin:8px 0 0; background:#fff; padding:6px 0 4px; }   /* v57: dính đáy bong bóng khi cuộn */
  html.ts #dang { background:transparent; align-items:flex-end; padding-bottom:20px; }
  html.ts #dang .hop { background:var(--kem); border:2px solid var(--nau); border-radius:16px; padding:12px 16px; box-shadow:0 8px 24px rgba(0,0,0,.25); }
  html.ts #dang img { height:100px; }
  @media (max-width:520px) { #so { display:none; } header .tt { display:none; } #chat { width:calc(100% - 16px); } }
</style>
</head>
<body>
<header>
  <b>Hóng Rồi mách lẻo</b>
  <span class="tt" id="tt">đang khởi động…</span>
  <div id="cho" title="Việc đang chờ sếp – bấm để mở PA staff"></div>
  <button id="nutTieng" title="Đọc to lời mách">Đọc to</button>
  <button id="nutBao" title="Hiện thông báo ở góc màn hình">Thông báo</button>
  <button id="nutThoat" title="Xóa PIN trên máy này">Thoát</button>
</header>
<div id="canh">
  <div id="tuong"></div><div id="san"></div>
  <div id="bien">P.A Tea &amp; Coffee · phòng nhân sự</div>
  <div id="hrw"><div id="hrb"><img id="hr" src="hr/tu-choi.webp" alt="Hóng Rồi mách lẻo" draggable="false"><img id="hrCu" alt="" aria-hidden="true"><div id="zzz" aria-hidden="true"><span>z</span><span>z</span><span>Z</span></div><div id="ban" aria-hidden="true"><div class="giay"></div><div class="coc">HR</div><div class="mat"></div><div class="than"></div><div class="chan t"></div><div class="chan p"></div></div></div></div>
  <div id="bong" role="status" aria-live="polite"></div>
  <form id="chat" autocomplete="off"><input id="chatO" placeholder="Trả lời / hỏi Hóng Rồi: ok · không · lương Khang tháng 11…" aria-label="Trả lời hoặc hỏi Hóng Rồi"><button>Gửi</button></form>
  <div id="so"><h4 id="soTieuDe"><span>Sổ mách lẻo hôm nay</span><span id="soDem"></span></h4><div class="ds" id="soDs"></div></div>
</div>
<div id="dang">
  <div class="hop">
    <img src="hr/tu-choi.webp" alt="" style="height:160px">
    <h3 style="margin:6px 0 0">Hóng Rồi mách lẻo</h3>
    <p>Nhập PIN chủ quán (PIN dùng ở mục Quản lý của PA staff). PIN chỉ lưu trên máy này.</p>
    <input id="pin" type="password" inputmode="numeric" autocomplete="off" placeholder="PIN chủ quán">
    <button id="nutVao">Cho Hóng Rồi vào làm</button>
    <p id="loiDang"></p>
  </div>
</div>
<script>
// Cửa sổ nhân sự "Hóng Rồi mách lẻo": hỏi máy chủ PA staff (adminSuKien) mỗi 90 giây, có việc mới thì
// cô HR dừng lại mách bằng bong bóng thoại (+ thông báo góc màn hình, + đọc to nếu bật). Rảnh thì đi qua đi lại.
const API_URL = 'https://script.google.com/macros/s/AKfycbwv-LwJq07oA4KH4NyA4fu1hWykZ0UQm6lrnMPkSuuuRbKcNrHNrxPzvMs08aldPHR3/exec';
const CHU_KY = 90 * 1000;          // hỏi máy chủ mỗi 90 giây
const NHAC_CHO = 45 * 60 * 1000;   // còn việc chờ duyệt: nhắc lại mỗi 45 phút
const $ = s => document.querySelector(s);
const APP = window.hongRoi || null;   // có khi chạy trong app Hóng Rồi cho Windows (cửa sổ trong suốt)
const TS = !!APP || /[?&]trongsuot=1/.test(location.search);
document.documentElement.classList.toggle('ts', TS);
const LINK_APP = new URL('./', location.href).href;
function moApp() { if (APP) APP.moLink(LINK_APP); else window.open(LINK_APP, 'pastaff'); }
const luu = { get: (k, d) => { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
              set: (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { } } };
// Ảnh Hóng (bộ mới 11/2026, tách nền lại từ bộ caro 18/11 – hết viền trắng). Mọi ảnh đứng/đi cùng khung 300×400: đầu ở giữa, chân chạm đáy → đổi ảnh không bị xê dịch.
// KT[t] = [độ rộng thân thật (để đặt bong bóng), chiều cao khung]. Ảnh "đi" quay mặt sang trái.
const KT = {"w01":[140,400],"w02":[172,400],"w03":[172,400],"w05":[174,400],"w07":[200,400],"w09":[166,400],"w10":[138,400],"w11":[130,400],"w12":[140,400],"chanh-choe":[150,400],"hong-chuyen":[162,400],"nghi-ngoi":[144,400],"noi-chuyen":[252,400],"nhun-vai":[218,400],"khinh-bi":[152,400],"tu-choi":[212,400],"ngac-nhien":[148,400],"che-mieng":[142,400],"chan-ghet":[156,400],"che-bai":[218,400],"met-moi":[142,400],"chi-tro":[286,400],"gian-doi":[140,400],"tron-mat":[192,400],"xi-xam":[144,400],"cuoi-lon":[148,400],"luom-nguyt":[140,400],"ngu-ban":[307,311],"ngu-ghe":[303,316],"ngu-cam":[378,321],"ngu-gap":[192,317],"dung":[140,400]};
// Tên tư thế dùng trong code → ảnh mới gần nghĩa nhất

const CO_GIO = /\d{1,2}\s*(:|h|giờ|g)\s*\d{0,2}/i;
async function hoiHong(cau) {   // v58: mỗi câu hỏi nằm trong PHIÊN CHAT (bong bóng giữ lịch sử, Hóng thức suốt phiên)
  if (st.dangNgu) thuc(); st.cuoiViec = Date.now();
  clearTimeout(st.henBong); clearTimeout(hen); clearInterval(khung);
  batDauPhien_(); st.chat.cuoi = Date.now();
  const hoiCu = st.hoi;
  st.dangMach = true;
  tuThe('ghi-so'); hoatCanh('');
  st.chat.log.push({ ai: 'sep', text: cau }); veChat_('Để Hóng Rồi lật sổ…');
  let kq; const phien = ++st.phien;
  try { kq = await call('adminHrHoi', luu.get('hr_pin', ''), cau, st.lichSu.slice(-6)); }
  catch (e) { kq = { hieu: true, text: e.message, loi: true }; }
  if (phien !== st.phien) return;   // sếp đã bấm Bỏ qua
  if (!kq.hieu && !HOI_RO.test(cau)) { st.chat.log.pop(); if (!st.chat.log.length) { st.chat.hien = false; } st.dangMach = false; return traLoi(cau, hoiCu); }   // không phải câu hỏi: coi là câu trả lời
  if (!kq.hieu) {   // rõ là câu hỏi mà Hóng chưa hiểu: KHÔNG coi là câu trả lời duyệt (15/11/2026: "có gì cần duyệt không" từng bị hiểu là "không")
    st.hoi = hoiCu; tuThe('nhun-vai'); hoatCanh('giat');
    st.chat.log.push({ ai: 'hong', loi: true, text: 'Hóng Rồi chưa hiểu câu hỏi này, chưa làm gì cả. Sếp hỏi lại kiểu khác giúp em nha.' + (kq.aiLoi ? '\n(AI tạm nghỉ: ' + kq.aiLoi + ')' : '') });
    return veChat_();
  }
  st.hoi = hoiCu;
  if (!kq.loi) { st.lichSu.push({ q: cau, a: kq.text }); st.lichSu = st.lichSu.slice(-6); st.lichSuLuc = Date.now(); }
  tuThe(kq.loi ? 'nhun-vai' : /hỏi ai|không thấy/.test(kq.text) ? 'nhun-vai' : 'chao2'); hoatCanh('giat');
  const viec = (kq.viec || []).map(x => Object.assign({}, x.sk, { goiY: x.chon }));   // việc chờ: thẻ có nút ngay dưới câu trả lời
  st.hang = st.hang.filter(x => !viec.some(y => y.k === x.k));
  st.chat.log.push({ ai: 'hong', text: kq.text, loi: !!kq.loi, the: viec.map(themThe_) });
  veChat_(); doc(kq.text.replace(/\n/g, '. '));
}

function datDay(y) {   // y = khoảng cách chân nhân vật tới đáy cửa sổ (px); null = về chỗ mặc định
  st.dayY = y; hrw.style.bottom = y === null ? '' : y + 'px';

function napViTri() {
  const v = luu.get('hr_vitri', null);

hr.addEventListener('pointerdown', e => {
  if (e.button !== undefined && e.button !== 0) return;
  e.preventDefault();
  const dayHienTai = canh.getBoundingClientRect().bottom - hrw.getBoundingClientRect().bottom;
  st.keo = { x0: e.clientX, y0: e.clientY, bx: st.x, by: dayHienTai, dichuyen: false };
  try { hr.setPointerCapture(e.pointerId); } catch (x) { }
});
hr.addEventListener('pointermove', e => {
  const k = st.keo; if (!k) return;
  const dx = e.clientX - k.x0, dy = e.clientY - k.y0;
  if (!k.dichuyen) {
    if (Math.hypot(dx, dy) < 6) return;
    k.dichuyen = true;
    if (st.dangNgu) { st.dangNgu = false; hrb.classList.remove('ngu'); }
    st.cuoiViec = Date.now();
    clearTimeout(hen); clearInterval(khung);
    hrw.style.transition = 'none'; hr.classList.remove('lat', 'di', 'chay', 'tho', 'giat', 'nhay');
    tuThe('hoang-hot'); hr.classList.add('dangKeo');
    if (!st.hoi) { clearTimeout(st.henBong); bong.classList.remove('hien', 'rong'); st.dangMach = false; }
  }
  const nr = (KT[st.ten] ? KT[st.ten][0] : 160) * K / 2, cao = hr.getBoundingClientRect().height;
  st.x = Math.max(nr, Math.min(canh.clientWidth - nr, k.bx + dx));
  hrw.style.left = st.x + 'px';
  datDay(Math.max(0, Math.min(canh.clientHeight - cao - 4, k.by - dy)));
  if (bong.classList.contains('hien')) datBong();
});
function thaRa(e) {
  const k = st.keo; if (!k) return;
  st.keo = null;
  try { hr.releasePointerCapture(e.pointerId); } catch (x) { }
  if (!k.dichuyen) { moiHoi(); return; }   // chỉ bấm, không kéo
  hr.classList.remove('dangKeo');
  luuViTri();
  st.dungYen = Date.now() + 2 * 60 * 1000;   // đứng yên chỗ mới 2 phút rồi mới đi lang thang (ngang, ở độ cao này)
  tuThe('tiep-dat'); setTimeout(() => { if (!st.keo) { tuThe('dung'); if (bong.classList.contains('hien')) datBong(); } }, 420);
  if (!st.dangMach) { clearTimeout(hen); hen = setTimeout(rongRai, 2600); }
}
hr.addEventListener('pointerup', thaRa);
hr.addEventListener('pointercancel', thaRa);

// ---------- hỏi máy chủ ----------
async function hoi() {
  try {
    const d = await call('adminSuKien', luu.get('hr_pin', ''));
    if (d.ngay !== st.ngay) {   // sang ngày mới: quên danh sách đã mách hôm qua
      st.ngay = d.ngay;
      const luuNgay = luu.get('hr_da', {});
      st.daMach = new Set(luuNgay.ngay === d.ngay ? luuNgay.k : []);
      $('#soDs').innerHTML = '';
    }
    const tong = Object.values(d.cho).reduce((a, b) => a + b, 0);
    if (st.tongCho > 0 && tong === 0) st.hang.push({ loai: 'mung', text: 'Hết sạch việc tồn rồi! Sếp đỉnh quá!' });
    st.tongCho = tong; st.cho = d.cho; veCho(d.cho); baoKhay();
    if (st.matMang) { st.matMang = false; st.hang.push({ loai: 'vao', nhe: true, text: 'Có mạng lại rồi, hóng tiếp!' }); }
    $('#tt').textContent = 'đang hóng · ' + (d.dangCo.length ? d.dangCo.length + ' người trong ca' : 'chưa ai trong ca') + ' · cập nhật ' + d.luc.slice(0, 5);
    // v51: việc cần quyết = có nút, chưa quyết; việc chờ thật (đơn, tăng ca, vắng…) đứng trước, lượt vào ca đúng giờ đứng cuối
    const CHO = { don: 1, xin: 1, tangca: 1, vang: 1, mat: 1, nl: 1 };
    st.canQuyet = d.ds.filter(x => x.nut && x.nut.length).sort((a, b) => (CHO[b.loai] ? 1 : 0) - (CHO[a.loai] ? 1 : 0) || (a.nhe ? 1 : 0) - (b.nhe ? 1 : 0));
    const conK = new Set(d.ds.filter(x => !x.daQuyet).map(x => x.k));
    document.querySelectorAll('#soDs .d').forEach(el => { if (el.dataset.k && !conK.has(el.dataset.k) && el.querySelector('button')) veSoDaXong(el.dataset.k); });   // đã xử lý ở app
    const moi = d.ds.filter(x => !st.daMach.has(x.k));
    moi.forEach(x => {
      st.daMach.add(x.k); ghiSo(x, x.gio || gioNay());
      if (x.daQuyet) return;            // sếp đã quyết (ở máy khác / trước đó): chỉ ghi sổ
      if (st.lanDau && x.nhe) return;   // mới mở cửa sổ: lượt vào ca cũ chỉ ghi sổ, không nói
      st.hang.push(x);
    });
    if (st.lanDau && st.hang.length > 4) {   // v51: dồn thành 1 khung thẻ thay vì mách từng vụ
      const n = st.hang.length, ds = st.hang.filter(x => x.nut && x.nut.length);
      st.hang = st.hang.filter(x => !(x.nut && x.nut.length));
      if (ds.length) st.hang.unshift({ loai: 'nhac', text: 'Từ đầu ngày hóng được ' + n + ' chuyện, ' + ds.length + ' việc cần sếp quyết – bấm nút ngay dưới từng việc:', ds });
    }
    st.lanDau = false;
    luu.set('hr_da', { ngay: st.ngay, k: [...st.daMach] });
    if (tong && Date.now() - st.cuoiNhac > NHAC_CHO && !moi.length) {
      st.cuoiNhac = Date.now();
      const ten = { don: 'đơn', xin: 'đơn xin phép', tangca: 'vụ tăng ca', vang: 'vụ vắng mặt', mat: 'lỗi khuôn mặt', nl: 'công ngoài lịch' };
      const dsCho = st.canQuyet.filter(x => !x.nhe).slice(0, 12);   // v51: mọi việc còn chờ trong 1 khung, mỗi việc kèm nút
      st.hang.push({ loai: 'nhac', text: 'Còn ' + Object.keys(ten).filter(k => d.cho[k]).map(k => d.cho[k] + ' ' + ten[k]).join(', ') + ' đang chờ sếp xử lý' + (dsCho.length ? ' – bấm nút ngay dưới từng việc:' : '.'), ds: dsCho });
    }
    if (dangChat_() && st.hang.length) chenVaoChat_(st.hang.splice(0));   // v58: đang trò chuyện -> mách ngay trong khung chat
    else if (!st.dangMach && st.hang.length) { if (st.dangNgu) thuc(); mach(st.hang.shift()); }
  } catch (e) {
    if (/PIN|mã quản lý|quyền|chủ quán làm/i.test(e.message)) { luu.set('hr_pin', ''); return moDang(e.message); }
    $('#tt').textContent = 'mất kết nối, thử lại sau · ' + gioNay();
    if (!st.matMang) { st.matMang = true; st.hang.push({ loai: 'loi', nhe: true, text: 'Mất mạng rồi sếp ơi, chờ tí hóng tiếp…' }); if (!st.dangMach) mach(st.hang.shift()); }
  }
  clearTimeout(st.henHoi); st.henHoi = setTimeout(hoi, CHU_KY);
}

// App Windows: chỗ trống bấm xuyên qua xuống màn hình bên dưới; chỉ nhân vật, bong bóng, ô trả lời, hộp PIN là bấm được
if (APP) {
  let tren = null;
  const kiem = (x, y) => {
    const el = document.elementFromPoint(x, y);
    const co = !!(st.keo || (el && el.closest('#hr, #bong.hien, #dang .hop, #chat')));
    if (co !== tren) { tren = co; APP.xuyen(!co); }
  };
  document.addEventListener('mousemove', e => kiem(e.clientX, e.clientY));
  APP.onLenh(l => {
    if (l === 'docTo') { st.tieng = !st.tieng; luu.set('hr_tieng', st.tieng); veNut(); noiNhe(st.tieng ? 'Đã bật đọc to.' : 'Đã tắt đọc to.'); baoKhay(); }
    else if (l === 'doiPin') { luu.set('hr_pin', ''); location.reload(); }
    else if (l === 'moApp') moApp();
    else if (l === 'veCho') { datDay(null); st.dungYen = 0; luuViTri(); noiNhe('Dạ, Hóng Rồi về chỗ cũ.'); }
  });
}
function baoKhay() { if (APP) APP.trangThai({ tieng: st.tieng, cho: st.tongCho > 0 ? st.tongCho : 0 }); }
window.addEventListener('resize', () => { tinhK(); tuThe(st.ten); if (bong.classList.contains('hien')) datBong(); });
if ('speechSynthesis' in window) speechSynthesis.onvoiceschanged = () => {};
if (luu.get('hr_pin', '')) { $('#dang').style.display = 'none'; batDau(); } else moDang();
</script>
